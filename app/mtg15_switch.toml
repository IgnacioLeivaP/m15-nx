# Magic 2015 for the Nintendo Switch: your options. This file is written next to the NRO at the first start when there
# is none; edit it there. Everything else is built into the NRO.

# Build default selected by install.py --language; empty follows the Switch system language.
mtg15_language = ""

# Controllers: buttons by letter (the Switch A accepts, as the Xbox A does, though it is the right button; the user
# asked for it 2026-11-08), and a single Joy-Con held sideways.
input_xbox_layout = false
input_joycon_sideways = true
